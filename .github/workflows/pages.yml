name: Publish both website themes to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the old website
        uses: actions/checkout@v4
        with:
          ref: main
          path: old-site

      - name: Check out Ocean Blue and Soft Rose
        uses: actions/checkout@v4
        with:
          ref: ocean-blue-soft-rose
          path: ocean-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            old-site/package-lock.json
            ocean-site/package-lock.json

      - name: Install old website dependencies
        working-directory: old-site
        run: npm ci

      - name: Prepare old website paths
        working-directory: old-site
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: /jibin-john-website
        run: node scripts/prepare-github-pages.mjs

      - name: Build old website
        working-directory: old-site
        env:
          NEXT_PUBLIC_BASE_URL: https://jibinjohnv.github.io/jibin-john-website
          NEXT_PUBLIC_SITE_BASE_PATH: /jibin-john-website
        run: npx next build

      - name: Install Ocean Blue and Soft Rose dependencies
        working-directory: ocean-site
        run: npm ci

      - name: Prepare Ocean Blue and Soft Rose paths
        working-directory: ocean-site
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: /jibin-john-website/ocean-blue-soft-rose
        run: node scripts/prepare-github-pages.mjs

      - name: Build Ocean Blue and Soft Rose
        working-directory: ocean-site
        env:
          NEXT_PUBLIC_BASE_URL: https://jibinjohnv.github.io/jibin-john-website/ocean-blue-soft-rose
          NEXT_PUBLIC_SITE_BASE_PATH: /jibin-john-website/ocean-blue-soft-rose
        run: npx next build

      - name: Combine both versions
        run: |
          mkdir -p pages-artifact/ocean-blue-soft-rose
          cp -R old-site/out/. pages-artifact/
          cp -R ocean-site/out/. pages-artifact/ocean-blue-soft-rose/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload both websites
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
